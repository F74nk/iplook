<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP 出口检测</title>
<meta name="description" content="从多个独立数据源检测你的公网 IP、IPv4 / IPv6 出口、归属地与运营商，并校验多源结果是否一致。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🛰️</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --bg2: #141720;
    --bg3: #1c2030;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8eaf0;
    --text2: #8b8fa8;
    --text3: #555870;
    --green: #22c98a;
    --green-dim: rgba(34,201,138,0.12);
    --blue: #4a9eff;
    --blue-dim: rgba(74,158,255,0.12);
    --coral: #ff6b4a;
    --coral-dim: rgba(255,107,74,0.12);
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.12);
    --violet: #a78bfa;
    --violet-dim: rgba(167,139,250,0.12);
    --red: #ff4a4a;
    --radius: 14px;
    --radius-sm: 8px;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  /* ── header ── */
  header {
    width: 100%;
    max-width: 960px;
    padding: 2.6rem 1.5rem 1.4rem;
    text-align: center;
  }

  .site-title {
    font-family: var(--mono);
    font-size: clamp(1.35rem, 4vw, 1.9rem);
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .site-title span { color: var(--green); }

  .site-sub {
    margin-top: 7px;
    font-size: 13px;
    color: var(--text3);
    letter-spacing: 0.2px;
    line-height: 1.7;
  }

  .site-host {
    display: inline-block;
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text3);
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 11px;
  }

  /* ── grid ── */
  main {
    width: 100%;
    max-width: 960px;
    padding: 0 1.5rem 3.5rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    margin-bottom: 1.4rem;
  }

  /* ── card ── */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
  }

  .card:hover { border-color: var(--border2); transform: translateY(-1px); }

  .card-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: var(--radius) var(--radius) 0 0;
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot.pulsing { animation: pulse 1.3s ease-in-out infinite; }
  .dot.ok { animation: none; }
  .dot.fail { animation: none; background: var(--red) !important; }
  .dot.none { animation: none; background: var(--text3) !important; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .card-name {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .badge {
    margin-left: auto;
    font-size: 10px;
    font-family: var(--mono);
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  /* ── IP display ── */
  .ip-value {
    font-family: var(--mono);
    font-size: clamp(15px, 3vw, 19px);
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
    word-break: break-all;
    min-height: 26px;
    line-height: 1.3;
  }

  .ip-copy {
    border: 0;
    background: transparent;
    color: var(--text3);
    font-family: var(--mono);
    font-size: 10.5px;
    cursor: pointer;
    padding: 0;
    margin-left: 6px;
    border-bottom: 1px dotted var(--text3);
    vertical-align: 2px;
  }
  .ip-copy:hover { color: var(--text2); }

  .ip-note {
    font-size: 14px;
    color: var(--text3);
    font-weight: 400;
    font-family: var(--sans);
  }

  /* ── detail rows ── */
  .detail { display: flex; flex-direction: column; gap: 5px; }

  .detail-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 12px;
  }

  .detail-icon {
    flex-shrink: 0;
    width: 14px;
    color: var(--text3);
    margin-top: 1px;
    font-size: 11px;
  }

  .detail-val { color: var(--text2); line-height: 1.45; word-break: break-word; }
  .detail-val.empty { color: var(--text3); font-style: italic; }

  /* ── skeleton ── */
  .sk { background: var(--bg3); border-radius: 4px; animation: shimmer 1.1s ease-in-out infinite; }
  @keyframes shimmer { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
  .sk-ip { height: 22px; width: 75%; margin-bottom: 10px; }
  .sk-row { height: 12px; margin-bottom: 5px; }

  /* ── bottom row ── */
  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .ts { font-size: 11px; color: var(--text3); font-family: var(--mono); }

  .refresh {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 7px 14px;
    cursor: pointer;
    font-family: var(--sans);
    transition: background 0.15s, color 0.15s;
  }

  .refresh:hover { background: var(--bg3); color: var(--text); }
  .refresh svg { width: 13px; height: 13px; flex-shrink: 0; }
  .refresh.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── summary ── */
  .map-wrap {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    margin-top: 14px;
  }

  .map-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }

  .verdict {
    margin-left: auto;
    text-transform: none;
    letter-spacing: 0;
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid;
  }
  .verdict.same { color: var(--green); border-color: rgba(34,201,138,.3); background: var(--green-dim); }
  .verdict.diff { color: var(--amber); border-color: rgba(245,166,35,.3); background: var(--amber-dim); }

  .ip-table { width: 100%; border-collapse: collapse; font-size: 12px; }

  .ip-table th {
    color: var(--text3);
    font-weight: 500;
    text-align: left;
    padding: 4px 8px 8px 0;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .ip-table td {
    padding: 7px 8px 7px 0;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    color: var(--text2);
  }

  .ip-table tr:last-child td { border-bottom: none; }
  .ip-table .mono { font-family: var(--mono); color: var(--text); }
  .ip-table .dim { color: var(--text3); }

  .color-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }

  /* ── 反查工具 ── */
  .qrow { display: flex; gap: 8px; }

  .qrow input {
    flex: 1; min-width: 0;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .qrow input::placeholder { color: var(--text3); font-family: var(--sans); }
  .qrow input:focus { border-color: rgba(74,158,255,0.55); }

  .qrow button {
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 0 20px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    transition: background 0.15s;
  }
  .qrow button:hover { background: #252a3a; }
  .qrow button:disabled { opacity: 0.5; cursor: default; }

  .qout { margin-top: 12px; font-size: 12.5px; color: var(--text2); }

  .qgrid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    margin-bottom: 10px;
  }
  .qcell { background: var(--bg2); padding: 9px 12px; }
  .qcell dt { font-size: 10.5px; color: var(--text3); margin-bottom: 2px; }
  .qcell dd { margin: 0; font-size: 12.5px; color: var(--text); font-family: var(--mono); word-break: break-word; }

  .qerr { color: var(--red); }
  .qhint { color: var(--text3); font-size: 11.5px; }

  /* ── 支持本站 / 赞赏码 ── */
  .donate {
    position: relative;
    display: inline-block;
    color: var(--green);
    cursor: pointer;
    border-bottom: 1px dotted rgba(34, 201, 138, 0.45);
    padding-bottom: 1px;
  }

  .donate-pop {
    display: none;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 1.7em;
    z-index: 40;
    width: 268px;
    max-width: 80vw;
    background: #ffffff;
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65);
    text-align: center;
  }

  .donate:hover .donate-pop,
  .donate.pin .donate-pop { display: block; }

  .donate-img { display: block; width: 100%; border-radius: 6px; }

  .donate-ph {
    display: none;
    color: #333;
    font-size: 11px;
    line-height: 1.7;
    padding: 28px 6px;
    font-family: var(--sans);
  }
  .donate-ph b { color: #111; font-size: 11.5px; }
  .donate-ph code {
    background: #f1f2f6;
    color: #c0392b;
    padding: 1px 4px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 10.5px;
  }

  /* ── footer ── */
  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text3);
    padding-bottom: 2rem;
    line-height: 1.8;
  }

  footer a { color: var(--text3); text-decoration: underline; text-underline-offset: 3px; }

  @media (max-width: 500px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { padding: 1rem; }
    .qgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .qrow { flex-direction: column; }
    .qrow button { padding: 10px; }
  }

  @media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div class="site-title">IP <span>出口</span> 检测</div>
  <div class="site-sub">从多个独立数据源查询你的公网 IP、IPv4 / IPv6 出口、归属地与运营商</div>
  <div class="site-host" id="siteHost">iplook.ipv64.net</div>
</header>

<main>
  <div class="grid" id="grid"></div>

  <div class="actions">
    <span class="ts" id="ts">正在检测…</span>
    <button class="refresh" id="refreshBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      重新检测
    </button>
  </div>

  <div class="map-wrap" id="summaryWrap" style="display:none">
    <div class="map-title">多源对比<span class="verdict" id="verdict"></span></div>
    <table class="ip-table">
      <thead>
        <tr><th>数据源</th><th>IP 地址</th><th>归属地</th><th>运营商</th></tr>
      </thead>
      <tbody id="summaryBody"></tbody>
    </table>
  <div class="map-wrap">
    <div class="map-title">反查任意 IP / 域名</div>
    <form class="qrow" id="qForm">
      <input id="qInput" placeholder="输入 IPv4 / IPv6 / 域名，例如 8.8.8.8 或 example.com" spellcheck="false" autocomplete="off">
      <button type="submit" id="qBtn">查询</button>
    </form>
    <div class="qout" id="qOut"></div>
  </div>
</main>

<footer>
  数据来源：ip.sb · ipapi.is · ipinfo.io · ipip.net · ipwho.is · freeipapi · ipify<br>
  全部查询在你的浏览器中直接发起，本站服务器不记录、不转发任何请求 · 仅供网络诊断参考<br>
  <span class="donate" id="donate">支持本站
    <span class="donate-pop">
      <img class="donate-img" id="donateImg" alt="微信赞赏码"
           onerror="this.style.display='none';document.getElementById('donatePh').style.display='block'">
      <span class="donate-ph" id="donatePh">
        <b>赞赏码未配置</b><br>
        赞赏码图片缺失<br>请检查页面内嵌数据
      </span>
    </span>
  </span>
</footer>

<script>
(function () {
  'use strict';

  /* ══════════ 工具 ══════════ */
  const $ = id => document.getElementById(id);
  const timeout = ms => (typeof AbortSignal !== 'undefined' && AbortSignal.timeout)
    ? AbortSignal.timeout(ms) : undefined;

  const isV6 = ip => !!ip && ip.indexOf(':') !== -1;
  const clean = v => (v == null ? '' : String(v).trim());

  let regionNames = null;
  try { regionNames = new Intl.DisplayNames(['zh-CN'], { type: 'region' }); } catch (e) {}
  function countryCN(cc, fallback) {
    if (cc && String(cc).length === 2 && regionNames) {
      try { const n = regionNames.of(String(cc).toUpperCase()); if (n && n !== cc) return n; } catch (e) {}
    }
    return clean(fallback) || clean(cc);
  }

  /* 国际库常用英文地名 → 中文（省 / 直辖市 / 主要城市） */
  const ZH_PLACE = {
    beijing: '北京', shanghai: '上海', tianjin: '天津', chongqing: '重庆',
    guangdong: '广东', zhejiang: '浙江', jiangsu: '江苏', shandong: '山东', henan: '河南',
    sichuan: '四川', hubei: '湖北', hunan: '湖南', hebei: '河北', fujian: '福建',
    anhui: '安徽', jiangxi: '江西', shaanxi: '陕西', shanxi: '山西', yunnan: '云南',
    guizhou: '贵州', guangxi: '广西', liaoning: '辽宁', jilin: '吉林', heilongjiang: '黑龙江',
    gansu: '甘肃', qinghai: '青海', xinjiang: '新疆', tibet: '西藏', xizang: '西藏',
    ningxia: '宁夏', 'inner mongolia': '内蒙古', neimenggu: '内蒙古', hainan: '海南',
    taiwan: '台湾', 'hong kong': '香港', hongkong: '香港', macau: '澳门', macao: '澳门',
    guangzhou: '广州', shenzhen: '深圳', hangzhou: '杭州', nanjing: '南京', wuhan: '武汉',
    chengdu: '成都', "xi'an": '西安', xian: '西安', suzhou: '苏州', qingdao: '青岛',
    dalian: '大连', xiamen: '厦门', changsha: '长沙', zhengzhou: '郑州', hefei: '合肥',
    fuzhou: '福州', kunming: '昆明', harbin: '哈尔滨', shenyang: '沈阳', jinan: '济南',
    ningbo: '宁波', wuxi: '无锡', dongguan: '东莞', foshan: '佛山', zhuhai: '珠海',
    nanning: '南宁', guiyang: '贵阳', lanzhou: '兰州', urumqi: '乌鲁木齐', hohhot: '呼和浩特',
    nanchang: '南昌', taiyuan: '太原', shijiazhuang: '石家庄', changchun: '长春',
    haikou: '海口', sanya: '三亚', lhasa: '拉萨', xining: '西宁', yinchuan: '银川'
  };
  const zhPlace = v => {
    const s = clean(v);
    if (!s) return '';
    return ZH_PLACE[s.toLowerCase()] || s;
  };

  function placeOf(d) {
    const arr = [countryCN(d.cc, d.country), zhPlace(d.region), zhPlace(d.city)];
    const out = [];
    arr.forEach(v => { if (v && out.indexOf(v) === -1) out.push(v); });
    return out;
  }

  /* ══════════ 数据源定义 ══════════
     每个源内按顺序尝试，第一个成功即采用。
     ip-api.com 免费版仅 HTTP，HTTPS 下 403 → 全部剔除
     domains.google.com/checkip 无 CORS → 剔除
  ═══════════════════════════ */
  const normIpinfo = d => ({
    ip: d.ip, cc: d.country, country: '', region: d.region, city: d.city,
    org: clean(d.org).replace(/^AS\d+\s*/, '')
  });

  const SOURCES = [
    {
      id: 'v4', label: 'IPv4 出口', sub: 'ipv4',
      color: '#f5a623', dotBg: '#f5a623',
      badgeBg: 'rgba(245,166,35,0.15)', badgeBorder: 'rgba(245,166,35,0.3)', badgeColor: '#f5a623',
      apis: [
        { url: 'https://api-ipv4.ip.sb/geoip',
          parse: d => ({ ip: d.ip, cc: d.country_code, country: d.country, region: d.region, city: d.city, org: d.isp || d.organization }) },
        { url: 'https://ipinfo.io/json', parse: normIpinfo },
        { url: 'https://api.ipify.org?format=json', parse: d => ({ ip: d.ip }), needGeo: true }
      ]
    },
    {
      id: 'v6', label: 'IPv6 出口', sub: 'ipv6',
      color: '#a78bfa', dotBg: '#a78bfa',
      badgeBg: 'rgba(167,139,250,0.15)', badgeBorder: 'rgba(167,139,250,0.3)', badgeColor: '#a78bfa',
      noneText: '当前网络无 IPv6',
      apis: [
        { url: 'https://api-ipv6.ip.sb/geoip',
          parse: d => ({ ip: d.ip, cc: d.country_code, country: d.country, region: d.region, city: d.city, org: d.isp || d.organization }) },
        { url: 'https://api6.ipify.org?format=json', parse: d => ({ ip: d.ip }), needGeo: true }
      ]
    },
    {
      id: 'cn', label: '国内接口', sub: 'cn db',
      color: '#22c98a', dotBg: '#22c98a',
      badgeBg: 'rgba(34,201,138,0.12)', badgeBorder: 'rgba(34,201,138,0.25)', badgeColor: '#22c98a',
      apis: [
        { url: 'https://myip.ipip.net/json', parse: d => {
            const L = (d && d.data && d.data.location) || [];
            return { ip: d && d.data ? d.data.ip : '', country: L[0], region: L[1], city: L[2], org: [L[3], L[4]].filter(Boolean).join('') };
          } },
        { url: 'https://ip.useragentinfo.com/json',
          parse: d => ({ ip: d.ip, country: d.country, region: d.province, city: d.city, org: d.isp || '' }) },
        { url: 'https://api-ipv4.ip.sb/geoip',
          parse: d => ({ ip: d.ip, cc: d.country_code, country: d.country, region: d.region, city: d.city, org: d.isp || '' }) }
      ]
    },
    {
      id: 'intl', label: '国际接口', sub: 'global db',
      color: '#4a9eff', dotBg: '#4a9eff',
      badgeBg: 'rgba(74,158,255,0.12)', badgeBorder: 'rgba(74,158,255,0.25)', badgeColor: '#4a9eff',
      apis: [
        { url: 'https://ipwho.is/', parse: d => {
            if (!d || d.success === false) throw new Error('fail');
            const c = d.connection || {};
            return { ip: d.ip, cc: d.country_code, country: d.country, region: d.region, city: d.city, org: c.org || c.isp || '' };
          } },
        { url: 'https://freeipapi.com/api/json',
          parse: d => ({ ip: d.ipAddress, cc: d.countryCode, country: d.countryName, region: d.regionName, city: d.cityName, org: '' }) },
        { url: 'https://ipinfo.io/json', parse: normIpinfo }
      ]
    }
  ];

  const state = {};

  /* ══════════ 渲染 ══════════ */
  const skeletonCard = s => `
    <div class="card" id="card-${s.id}">
      <div class="card-bar" style="background:${s.color}"></div>
      <div class="card-head">
        <div class="dot pulsing" style="background:${s.dotBg}"></div>
        <span class="card-name" style="color:${s.color}">${s.label}</span>
        <span class="badge" style="background:${s.badgeBg};border-color:${s.badgeBorder};color:${s.badgeColor}">${s.sub}</span>
      </div>
      <div class="sk sk-ip"></div>
      <div class="detail">
        <div class="sk sk-row" style="width:90%"></div>
        <div class="sk sk-row" style="width:65%"></div>
        <div class="sk sk-row" style="width:75%"></div>
      </div>
    </div>`;

  function cardShell(s, dotClass, ipHtml, detailHtml) {
    return `
    <div class="card" id="card-${s.id}">
      <div class="card-bar" style="background:${s.color}"></div>
      <div class="card-head">
        <div class="dot ${dotClass}" style="background:${s.dotBg}"></div>
        <span class="card-name" style="color:${s.color}">${s.label}</span>
        <span class="badge" style="background:${s.badgeBg};border-color:${s.badgeBorder};color:${s.badgeColor}">${s.sub}</span>
      </div>
      <div class="ip-value">${ipHtml}</div>
      <div class="detail">${detailHtml}</div>
    </div>`;
  }

  const doneCard = (s, d) => {
    const place = placeOf(d);
    const loc = place.length ? place.join(' / ') : '归属地未知';
    const detail =
      `<div class="detail-row"><span class="detail-icon">📍</span><span class="detail-val">${esc(loc)}</span></div>` +
      (d.org ? `<div class="detail-row"><span class="detail-icon">🏢</span><span class="detail-val">${esc(d.org)}</span></div>` : '');
    return cardShell(s, 'ok',
      `<span class="ip-text">${esc(d.ip)}</span><button class="ip-copy" data-ip="${esc(d.ip)}">复制</button>`, detail);
  };

  const failCard = s => cardShell(s, 'fail',
    '<span class="ip-note" style="color:#ff6b6b">检测失败</span>',
    '<div class="detail-row"><span class="detail-val empty">所有备用接口均无响应，可能被网络限制或跨域拦截</span></div>');

  const noneCard = s => cardShell(s, 'none',
    `<span class="ip-note">${esc(s.noneText || '不可用')}</span>`,
    '<div class="detail-row"><span class="detail-val empty">该协议在当前网络下不可用，属正常情况</span></div>');

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function paint(s) {
    const el = $('card-' + s.id);
    const st = state[s.id];
    if (!el || !st || !st.done) return;
    el.outerHTML = st.kind === 'ok' ? doneCard(s, st.data)
                 : st.kind === 'none' ? noneCard(s)
                 : failCard(s);
  }

  /* ══════════ 汇总 ══════════ */
  function paintSummary() {
    if (!SOURCES.every(s => state[s.id] && state[s.id].done)) return;
    const rows = SOURCES.map(s => {
      const st = state[s.id];
      const d = st.kind === 'ok' ? st.data : null;
      const loc = d ? (placeOf(d).join(' / ') || '—') : '<span class="dim">—</span>';
      const org = d && d.org ? esc(d.org) : '<span class="dim">—</span>';
      const ipCell = d ? `<span class="mono">${esc(d.ip)}</span>` : '<span class="dim">不可用</span>';
      return `<tr>
        <td><span class="color-dot" style="background:${s.color}"></span>${s.label}</td>
        <td>${ipCell}</td>
        <td>${loc}</td>
        <td style="font-size:11px">${org}</td>
      </tr>`;
    }).join('');
    $('summaryBody').innerHTML = rows;

    // 一致性判定：所有成功返回的 IP 是否相同
    const ips = SOURCES.map(s => state[s.id]).filter(st => st.kind === 'ok' && st.data && st.data.ip)
                       .map(st => st.data.ip);
    const uniq = Array.from(new Set(ips));
    const v = $('verdict');
    if (!ips.length) { v.textContent = '无数据'; v.className = 'verdict diff'; }
    else if (uniq.length === 1) { v.textContent = '全部一致'; v.className = 'verdict same'; }
    else { v.textContent = '存在 ' + uniq.length + ' 个不同出口'; v.className = 'verdict diff'; }

    $('summaryWrap').style.display = 'block';
  }

  /* ══════════ 反查归属地（多源兜底） ══════════ */
  const GEO_APIS = [
    async ip => {
      const r = await fetch('https://ipwho.is/' + encodeURIComponent(ip), { signal: timeout(6000) });
      if (!r.ok) throw 0;
      const d = await r.json();
      if (!d || d.success === false) throw 0;
      const c = d.connection || {};
      return { cc: d.country_code, country: d.country, region: d.region, city: d.city, org: c.org || c.isp || '' };
    },
    async ip => {
      const r = await fetch('https://freeipapi.com/api/json/' + encodeURIComponent(ip), { signal: timeout(6000) });
      if (!r.ok) throw 0;
      const d = await r.json();
      return { cc: d.countryCode, country: d.countryName, region: d.regionName, city: d.cityName, org: '' };
    },
    async ip => {
      const r = await fetch('https://api.ip.sb/geoip/' + encodeURIComponent(ip), { signal: timeout(6000) });
      if (!r.ok) throw 0;
      const d = await r.json();
      return { cc: d.country_code, country: d.country, region: d.region, city: d.city, org: d.isp || d.organization || '' };
    }
  ];

  async function geoLookup(ip) {
    for (const fn of GEO_APIS) {
      try { const g = await fn(ip); if (g && (g.country || g.city)) return g; } catch (e) {}
    }
    return {};
  }

  /* ══════════ 单源检测 ══════════ */
  const IP_RE = /^(\d{1,3}(\.\d{1,3}){3}|[0-9a-f:]{4,})$/i;

  async function fetchSource(s) {
    for (const api of s.apis) {
      try {
        const r = await fetch(api.url, { signal: timeout(8000), cache: 'no-store' });
        if (!r.ok) continue;
        const raw = api.text ? await r.text() : await r.json();
        const data = api.parse(raw);
        const ip = clean(data && data.ip);
        if (!ip || !IP_RE.test(ip)) continue;
        data.ip = ip;
        if (api.needGeo) Object.assign(data, await geoLookup(ip));
        return data;
      } catch (e) { /* 换下一个备用接口 */ }
    }
    return null;
  }

  /* ══════════ 主流程 ══════════ */
  let running = false;

  async function startAll() {
    if (running) return;
    running = true;

    SOURCES.forEach(s => { state[s.id] = { done: false }; });
    $('grid').innerHTML = SOURCES.map(skeletonCard).join('');
    $('summaryWrap').style.display = 'none';
    $('ts').textContent = '正在检测…';

    const btn = $('refreshBtn');
    btn.classList.add('spinning');
    btn.disabled = true;

    await Promise.allSettled(SOURCES.map(async s => {
      const data = await fetchSource(s);
      if (data) state[s.id] = { done: true, kind: 'ok', data };
      else state[s.id] = { done: true, kind: s.noneText ? 'none' : 'fail' };
      paint(s);
      paintSummary();
    }));

    $('ts').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    btn.classList.remove('spinning');
    btn.disabled = false;
    running = false;
  }

  /* 复制 IP */
  document.addEventListener('click', ev => {
    const btn = ev.target.closest('.ip-copy');
    if (!btn) return;
    const ip = btn.dataset.ip;
    const done = () => { const o = btn.textContent; btn.textContent = '已复制'; setTimeout(() => btn.textContent = o, 1300); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(ip).then(done).catch(fallback);
    } else fallback();
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = ip; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  });

  /* 赞赏码：桌面端悬停显示，移动端点一下固定 */
  (function () {
    const d = $('donate');
    if (!d) return;
    d.addEventListener('click', ev => { ev.stopPropagation(); d.classList.toggle('pin'); });
    document.addEventListener('click', () => d.classList.remove('pin'));
  })();

  $('refreshBtn').addEventListener('click', startAll);

  // 站点域名展示
  (function () {
    const h = location.hostname;
    if (h && location.protocol.indexOf('http') === 0 && h !== '127.0.0.1' && h !== 'localhost') {
      $('siteHost').textContent = h;
    }
  })();

  /* ══════════ 反查 IP / 域名 ══════════ */
  const DNS_NAME_RE = /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/i;

  async function resolveName(name) {
    const found = [];
    for (const t of ['A', 'AAAA']) {
      try {
        const r = await fetch('https://dns.google/resolve?name=' + encodeURIComponent(name) + '&type=' + t,
          { signal: timeout(6000), cache: 'no-store' });
        if (!r.ok) continue;
        const d = await r.json();
        (d.Answer || []).forEach(a => {
          if ((a.type === 1 || a.type === 28) && found.indexOf(a.data) === -1) found.push(a.data);
        });
      } catch (e) {}
    }
    return found;
  }

  async function describeIp(ip) {
    const g = await geoLookup(ip);
    let asn = '', isp = '', tz = '';
    try {
      const r = await fetch('https://api.ipapi.is/?q=' + encodeURIComponent(ip), { signal: timeout(6000), cache: 'no-store' });
      if (r.ok) {
        const d = await r.json();
        asn = clean(d.asn); isp = clean(d.company); tz = clean(d.timezone);
      }
    } catch (e) {}
    return [
      ['IP', ip],
      ['类型', isV6(ip) ? 'IPv6' : 'IPv4'],
      ['归属', placeOf(g).join(' / ') || '—'],
      ['ASN', asn || '—'],
      ['运营商', isp || g.org || '—'],
      ['时区', tz || '—']
    ];
  }

  $('qForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const q = $('qInput').value.trim().replace(/^https?:\/\//i, '').replace(/[/?#].*$/, '');
    const out = $('qOut'), btn = $('qBtn');
    if (!q) return;

    btn.disabled = true;
    out.innerHTML = '<span class="qhint">查询中…</span>';

    try {
      let ips;
      if (IP_RE.test(q)) ips = [q];
      else if (DNS_NAME_RE.test(q)) ips = await resolveName(q);
      else throw new Error('请输入合法的 IP 地址或域名');

      if (!ips.length) throw new Error('该域名没有解析到 A / AAAA 记录');

      const blocks = [];
      for (const ip of ips.slice(0, 4)) {
        const cells = await describeIp(ip);
        blocks.push('<div class="qgrid">' + cells.map(([k, v]) =>
          '<div class="qcell"><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>').join('') + '</div>');
      }
      out.innerHTML = blocks.join('');
    } catch (e) {
      out.innerHTML = '<span class="qerr">查询失败：' + esc(e.message) + '</span>';
    } finally {
      btn.disabled = false;
    }
  });

  startAll();
})();
</script>
